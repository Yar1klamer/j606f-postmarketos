# Lenovo Tab P11 (TB-J606F): Adreno 610 driving a 2000x1200 panel. mpv's default high-quality scaling
# shaders do not keep up at this size (most frames are dropped on output), the fast profile does.
# Settings in ~/.config/mpv/mpv.conf override these.
profile=fast

# Venus decodes H.264/HEVC in hardware (hwdec=v4l2m2m-copy), but copying the frames back drops more of
# them on output than software decoding does: 1080p H.264 at 30 fps ~180 of 360 vs 0, at 60 fps ~550
# of 720 vs ~5 (measured 2026-10-31). Software decoding stays the default.
hwdec=no
