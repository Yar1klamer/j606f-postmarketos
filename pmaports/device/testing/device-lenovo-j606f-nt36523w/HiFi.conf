# Lenovo Tab P11 (TB-J606F): four AW88258 speaker amplifiers on the primary TDM port, stereo:
# SpkBL/SpkTL take the left channel, SpkBR/SpkTR the right one. The amplifiers stay at their
# highest level (-6 dB, the driver cap without the stock DSP speaker protection), the volume
# is done in software. The built-in microphone (mono) is on the WCD9370 codec. The USB-C headset
# path (WCD937x behind an FSA4480 switch) is not here yet.

SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='SpkBL Volume' 168"
		cset "name='SpkBR Volume' 168"
		cset "name='SpkTL Volume' 168"
		cset "name='SpkTR Volume' 168"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

# Built-in microphone (mono; worked out by kruzeman, github.com/kruzeman/ALARM-Lenovo-P11).
# Path: WCD9370 ADC1 <- AMIC1 -> TX slave port 1 on SoundWire (swr0, clocked by the TX macro)
# -> TX SMIC MUX0 (SWR_MIC0) -> TX DEC0 -> TX_AIF1_CAP -> TX_CODEC_DMA_TX_3 -> DSP -> MultiMedia2.
# All TX macro muxes are off by default; without them the DSP returns no period at all.
SectionDevice."Mic" {
	Comment "Built-in microphone"

	EnableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='TX SMIC MUX0' 1"
		cset "name='TX DEC0 MUX' 1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		# TX_DEC0 at 0 dB is barely audible; 112 (+28 dB) and ADC1 20 measured on the hardware
		cset "name='TX_DEC0 Volume' 112"
		cset "name='ADC1 Volume' 20"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CaptureRate 48000
	}
}
