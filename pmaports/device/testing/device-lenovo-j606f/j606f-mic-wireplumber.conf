# Lenovo TB-J606F: the q6asm capture PCM advertises S24_LE, but the samples arrive
# left-justified (S32-like), so a 24-bit open reads garbage. 16-bit capture is correct.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_input.platform-sound.HiFi__Mic__source" } ]
    actions = { update-props = { audio.format = "S16LE" } }
  }
]
