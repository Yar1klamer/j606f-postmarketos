# hexagonrpcd serves the ADSP this tablet's own files, which j606f-firmware-extract takes from its
# partitions; without -R (the stock /usr/share/qcom root) the ADSP crashes every few seconds
[Unit]
After=j606f-firmware-extract.service
ConditionDirectoryNotEmpty=/usr/share/qcom/sm6115/LENOVO/J606F/dsp/adsp
ConditionDirectoryNotEmpty=/usr/share/qcom/sm6115/LENOVO/J606F/sensors/registry

[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -s -R /usr/share/qcom/sm6115/LENOVO/J606F
