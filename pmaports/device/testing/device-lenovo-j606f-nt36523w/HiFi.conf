# Lenovo Tab P11 (TB-J606F): four AW88258 speaker amplifiers on the primary TDM port, stereo:
# SpkBL/SpkTL take the left channel, SpkBR/SpkTR the right one. The amplifiers stay at their
# highest level (-6 dB, the driver cap without the stock DSP speaker protection), the volume
# is done in software. The USB-C headset path (WCD937x behind an FSA4480 switch) is not here yet.

SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='SpkBL Volume' 168"
		cset "name='SpkBR Volume' 168"
		cset "name='SpkTL Volume' 168"
		cset "name='SpkTR Volume' 168"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
